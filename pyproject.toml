[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdda-mod-framework"
version = "0.1.0"
description = "Tools and scripts for CDDA mod development and porting"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
mapgen-compile = "mapgen.cli:main"

[tool.setuptools]
# B-2: scripts/ is the package root. Top-level modules (common.py etc.)
# are distributed as py-modules; the mapgen subpackage via packages.find.
# Do NOT add scripts/__init__.py (it would not put top-level modules
# into the wheel). src-layout migration was considered and rejected
# for B-2 as higher churn for the same result.
package-dir = {"" = "scripts"}
py-modules = [
    "add_activity_level",
    "common",
    "convert_item_types",
    "convert_price",
    "mapgen_compiler",
    "remove_armor_bullet",
    "remove_invalid_fields",
    "revert_all_translations",
    "revert_translation_errors",
    "summarize_debug_log",
    "validate_mods",
    "verify_patches",
]

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["mapgen*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]
include = "\\.pyi?$"
extend-exclude = """
/(
  external
)/
"""

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["external"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # Pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
]
ignore = [
  "E501", # line too long (handled by black)
]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra -q"
# B-2: declarative import path for tests (replaces conftest.py sys.path hack).
# scripts/ holds top-level modules (common, converters) + the mapgen package.
pythonpath = ["scripts"]

[tool.mypy]
mypy_path = "scripts"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

# Test files are out of strict scope (they use dynamic fixtures/tempfiles).
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# Porting scripts: use dynamic callbacks and recursive Any-typed JSON traversal,
# which cannot be typed precisely under strict mode.
[[tool.mypy.overrides]]
module = "convert_item_types"
ignore_errors = true

[[tool.mypy.overrides]]
module = "add_activity_level"
ignore_errors = true

[[tool.mypy.overrides]]
module = "remove_armor_bullet"
ignore_errors = true

[[tool.mypy.overrides]]
module = "remove_invalid_fields"
ignore_errors = true

[[tool.mypy.overrides]]
module = "revert_all_translations"
ignore_errors = true

[[tool.mypy.overrides]]
module = "revert_translation_errors"
ignore_errors = true
