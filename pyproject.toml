[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdda-mod-framework"
version = "0.1.0"
description = "Tools and scripts for CDDA mod development and porting"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "black",
    "mypy",
    "pytest",
    "ruff",
    "types-PyYAML",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = "\\.pyi?$"
extend-exclude = """
/(
  external
)/
"""

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["external"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # Pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
]
ignore = [
  "E501", # line too long (handled by black)
]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra -q"

[tool.mypy]
mypy_path = "scripts"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

# Test files are out of strict scope (they use dynamic fixtures/tempfiles).
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# Flat transformation scripts share a loose runtime contract; keep them
# non-strict so the mapgen package can enforce strict typing independently.
[[tool.mypy.overrides]]
module = "common"
ignore_errors = true

[[tool.mypy.overrides]]
module = "convert_item_types"
ignore_errors = true

[[tool.mypy.overrides]]
module = "convert_price"
ignore_errors = true

[[tool.mypy.overrides]]
module = "add_activity_level"
ignore_errors = true

[[tool.mypy.overrides]]
module = "remove_armor_bullet"
ignore_errors = true

[[tool.mypy.overrides]]
module = "remove_invalid_fields"
ignore_errors = true

[[tool.mypy.overrides]]
module = "summarize_debug_log"
ignore_errors = true

[[tool.mypy.overrides]]
module = "revert_all_translations"
ignore_errors = true

[[tool.mypy.overrides]]
module = "revert_translation_errors"
ignore_errors = true
