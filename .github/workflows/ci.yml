name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A-2 minimal hardening: least-privilege default + avoid stale runs.
# NOTE: workflow_dispatch/schedule intentionally deferred to E-7 (human decision).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check scripts/
      - run: black --check scripts/
      - run: python -m pytest scripts/tests/ -v --cov=scripts --cov-report=term-missing
      - run: mypy scripts/

  shell:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck scripts/*.sh

  # NOTE (C-2, human decision b): Level2 (scripts/check_mods.sh engine check)
  # is intentionally NOT run in CI. external/cdda/ is gitignored so the
  # cataclysm-tiles binary and mods/ tree are absent on CI runners.
  # Manual procedure (see rules/verification.md "Level2自動"):
  #   bash scripts/place_mod_for_test.sh --link mods/small/<mod>/
  #   bash scripts/check_mods.sh --isolated <mod_id>
  validate-mods:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_mods.py

  verify-patches:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/verify_patches.py
