name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # E-7 (human decision): manual + weekly schedule.
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC

# A-2 minimal hardening: least-privilege default + avoid stale runs.
# NOTE: workflow_dispatch/schedule added in E-7 (was deferred in A-2).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# E-7: guarantee `| tee` steps fail when the validator fails (pipefail).
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  python:
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check scripts/
      - run: black --check scripts/
      - run: python -m pytest scripts/tests/ -v --cov=scripts --cov-report=term-missing --cov-fail-under=90
      - run: mypy scripts/
      # B-2 packaging guard: dist layout repair (cf720d33) regresses silently
      # without an install check (py-modules 12 entries + mapgen* package).
      - run: pip install -e .
      - run: python -c "import add_activity_level, common, convert_item_types, convert_price, mapgen_compiler, remove_armor_bullet, revert_all_translations, revert_translation_errors, summarize_debug_log; import mapgen.cli; print('wheel-import-ok')"
      - run: python -m pip wheel . --no-deps -w dist
      - run: python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(whl) as z:
              names = z.namelist()
              assert "mapgen/palettes.json" in names, names
              assert not any(n in names for n in ("validate_mods.py", "verify_patches.py", "remove_invalid_fields.py")), names
          print("wheel contents ok")
          PY
      - run: mapgen-compile --help

  shell:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck via apt (no cache: /var/cache/apt/archives needs root and
      # `apt-get update` refetches lists every run, so caching is ineffective).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - run: shellcheck --version
      - run: shellcheck scripts/*.sh

  # NOTE (C-2, human decision b): Level2 (scripts/check_mods.sh engine check)
  # is intentionally NOT run in CI. external/cdda/ is gitignored so the
  # cataclysm-tiles binary and mods/ tree are absent on CI runners.
  # Manual procedure (see rules/verification.md "Level2自動"):
  #   bash scripts/place_mod_for_test.sh mods/small/<mod>/
  #   bash scripts/check_mods.sh --isolated <mod_id>
  # E-7: validate-mods + verify-patches merged into one job to remove
  # checkout/setup-python duplication (was checkout x4 / setup-python x3).
  # Both scripts run with the pinned dev deps (pip cache enabled); outputs
  # are tee'd to logs and uploaded as artifacts for inspection.
  validate:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # upload-artifact needs actions:write; other jobs keep the top-level
    # contents:read default (least privilege).
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # F-1: --quiet keeps CI logs small (per-file OK suppressed, errors shown).
      - run: python scripts/validate_mods.py --quiet 2>&1 | tee validate-mods.log
      - run: python scripts/verify_patches.py 2>&1 | tee verify-patches.log
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: |
            validate-mods.log
            verify-patches.log
